name: Compilar Mod Fabric 1.21.1

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Descomprimir y preparar archivos
        run: |
          echo "=== Archivos iniciales en el repositorio ==="
          ls -la

          ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Descomprimiendo: $ZIP_FILE"
            unzip -o "$ZIP_FILE"
          fi

          GRADLE_DIR=$(find . -name "build.gradle" -exec dirname {} \; | head -n 1)
          if [ -n "$GRADLE_DIR" ] && [ "$GRADLE_DIR" != "." ]; then
            echo "Moviendo archivos desde $GRADLE_DIR a la raiz..."
            cp -rn "$GRADLE_DIR"/* .
          fi

          echo "=== Archivos en la raiz tras mover ==="
          ls -la

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Compilar con Gradle
        run: gradle build --stacktrace

      - name: Guardar archivo JAR
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
